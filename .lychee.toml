# .lychee.toml
accept = [200, 429]
exclude = [
    "http://localhost:*",
    "http://127.0.0.1:*",
    "https://github.com/OBLIQ-in/obliq-OCR/settings/secrets/actions"
]
exclude_path = [
    ".git/",
    "venv/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
    "dist/"
]
verbose = "info"
