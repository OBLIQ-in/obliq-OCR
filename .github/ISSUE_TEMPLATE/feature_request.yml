name: Feature Request
description: Propose a new feature, enhancement, or capability for obliq-OCR.
title: "[Feat]: "
labels: ["type:feature", "needs-triage"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you want to achieve or add.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case & Motivation
      description: Why is this feature needed? What problem does it solve for users or downstream workflows?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Implementation / Design
      description: Optional detailed description of how this could be implemented (API surface, modules, or dependencies).
    validations:
      required: false
