name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # Required for creating GitHub Releases and uploading artifacts

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Required for OIDC token and attestations
      attestations: write  # Required for PEP 740 build provenance attestations
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}

  test-testpypi:
    name: Smoke Test from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package from TestPyPI
        run: |
          sleep 10 # Allow TestPyPI index to propagate
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ obliq-ocr

      - name: Verify Import and Basic Check
        run: |
          python -c "import obliq_ocr; print('Successfully imported obliq-ocr from TestPyPI')"

  publish-pypi:
    name: Publish to Production PyPI
    needs: test-testpypi
    runs-on: ubuntu-latest
    environment: pypi   # Ensures the manual review approval gate runs
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
