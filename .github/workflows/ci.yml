name: CI Quality Gates

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (OpenCV / OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] ruff mypy

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check --exclude src/obliq_ocr/_version.py .

      - name: Run Mypy Type Check
        run: mypy src/

  test-matrix:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (OpenCV / OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test,dev] pytest pytest-cov

      - name: Generate Synthetic PDF Fixtures
        run: python tests/scripts/generate_fixtures.py

      - name: Run Pytest Suite with Coverage
        run: python -m pytest --cov=obliq_ocr

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          slug: OBLIQ-in/obliq-OCR
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-package:
    name: Build & Validate Package
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PEP 517 Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine hatch-vcs

      - name: Build Source Distribution and Wheel
        run: python -m build

      - name: Check Package Metadata Rendering
        run: twine check dist/*

      - name: Install Wheel in Isolated Venv & Run Smoke Test
        run: |
          python -m venv .smoke_venv
          source .smoke_venv/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python -c "import obliq_ocr; print('Package imported successfully, version:', obliq_ocr.__version__)"
          obliq-ocr --help
