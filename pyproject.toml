[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "obliq-ocr"
description = "Page-aware OCR and document-parsing pipeline combining PyMuPDF and RapidOCR."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rahul Kate", email = "rahulkate173@gmail.com" },
    { name = "Abhiraj Adhikary", email = "abhirajadhikary06@gmail.com" },
    { name = "Naman Jha", email = "itsnaman0007@gmail.com" }
    ]
keywords = ["ocr", "pdf", "pymupdf", "rapidocr", "document-parsing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]

# Python version support: 3.10+
requires-python = ">=3.10"

# Dynamic version sourced from Git tags
dynamic = ["version"]

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
dependencies = [
    # PDF rendering and text-layer extraction
    "pymupdf>=1.24.0",

    # OCR engine (PP-OCR models on ONNX Runtime – CPU build)
    # Switch to rapidocr-paddle or rapidocr-onnxruntime-gpu for GPU support.
    "rapidocr_onnxruntime>=1.3.18",

    # ONNX Runtime (CPU) – pinned to a version range compatible with rapidocr
    "onnxruntime>=1.17.0,<2.0.0",

    # Image processing (used for image-file input and page rendering)
    "pillow>=10.0.0",

    # Numerical computing
    "numpy>=1.24.0",
]

# ---------------------------------------------------------------------------
# Optional extras
# ---------------------------------------------------------------------------
[project.optional-dependencies]
gpu = [
    # Replaces the CPU onnxruntime build for CUDA-accelerated inference.
    # Install with: pip install "obliq-ocr[gpu]"
    # You must uninstall onnxruntime (CPU) first if it is already installed.
    "onnxruntime-gpu>=1.17.0,<2.0.0",
]
test = [
    "pytest>7.0",
    "pytest-cov>=4.0",
    "jiwer>=3.0.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "hatchling>=1.25.0",
    "hatch-vcs>=0.4.0",
    "pre-commit>=3.7.0",
]

# Docs site tools only (mkdocs reads src/ without importing it), so CI can
# build the docs without the OCR packages: pip install --group docs
# Needs Python 3.11+; older mkdocstrings releases break with current
# pymdown-extensions.
[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7",
    "mkdocstrings>=1.0.7",
    "mkdocstrings-python>=2.0.10",
]

[project.urls]
Homepage = "https://github.com/OBLIQ-in/obliq-OCR"
Documentation = "https://obliq-in.github.io/obliq-OCR/"
Repository = "https://github.com/OBLIQ-in/obliq-OCR"
Issues = "https://github.com/OBLIQ-in/obliq-OCR/issues"
Changelog = "https://github.com/OBLIQ-in/obliq-OCR/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Versioning configuration (hacth-vcs)
# ---------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel.hooks.vcs]
version-file = "src/obliq_ocr/_version.py"

# ---------------------------------------------------------------------------
# Console scripts (CLI)
# ---------------------------------------------------------------------------
[project.scripts]
obliq-ocr = "obliq_ocr.cli:main"

# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/obliq_ocr"]

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=obliq_ocr",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]

# ---------------------------------------------------------------------------
# Ruff linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# ---------------------------------------------------------------------------
# CLI coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src/obliq_ocr"]
omit = [
    "src/obliq_ocr/__main__.py",
    "src/obliq_ocr/cli.py",
]

# ---------------------------------------------------------------------------
# Mypy type-checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
