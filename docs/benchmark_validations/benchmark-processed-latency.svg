<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Processed PDFs: average seconds per page by engine</title>
  <desc id="desc">Horizontal bar chart, lower is faster. obliq-ocr 0.024, EasyOCR 42.027, RapidOCR ONNX 3.240, Tesseract 1.362, docTR 6.356 seconds per page. obliq-ocr extracts native PDF text.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#203047}.title{font-size:23px;font-weight:700}.sub{font-size:14px;fill:#526174}.label{font-size:15px}.value{font-size:14px;font-weight:700}.tick{font-size:12px;fill:#526174}.grid{stroke:#dbe3ec;stroke-width:1}</style>
  <rect width="1000" height="450" rx="14" fill="#fff"/>
  <text x="30" y="40" class="title">Processed PDFs · mean processing time</text>
  <text x="30" y="65" class="sub">Seconds per page · lower is faster · 2 PDFs / 5 pages</text>
  <g class="grid"><line x1="220" y1="95" x2="220" y2="350"/><line x1="360" y1="95" x2="360" y2="350"/><line x1="500" y1="95" x2="500" y2="350"/><line x1="640" y1="95" x2="640" y2="350"/><line x1="780" y1="95" x2="780" y2="350"/><line x1="920" y1="95" x2="920" y2="350"/></g>
  <g class="tick" text-anchor="middle"><text x="220" y="376">0</text><text x="360" y="376">10</text><text x="500" y="376">20</text><text x="640" y="376">30</text><text x="780" y="376">40</text><text x="920" y="376">50 s</text></g>
  <g class="label" text-anchor="end"><text x="205" y="132">obliq-ocr</text><text x="205" y="182">EasyOCR</text><text x="205" y="232">RapidOCR ONNX</text><text x="205" y="282">Tesseract</text><text x="205" y="332">docTR</text></g>
  <rect x="220" y="112" width="3" height="25" rx="2" fill="#087f8c"/><text x="231" y="130" class="value">0.024</text>
  <rect x="220" y="162" width="588.4" height="25" rx="5" fill="#e58b2a"/><text x="817" y="180" class="value">42.027</text>
  <rect x="220" y="212" width="45.4" height="25" rx="5" fill="#3977c3"/><text x="277" y="230" class="value">3.240</text>
  <rect x="220" y="262" width="19.1" height="25" rx="5" fill="#7756a8"/><text x="251" y="280" class="value">1.362</text>
  <rect x="220" y="312" width="89.0" height="25" rx="5" fill="#3c9563"/><text x="321" y="330" class="value">6.356</text>
  <text x="30" y="405" class="sub">obliq-ocr extracts the native PDF text layer here; this is not OCR-inference time.</text>
  <text x="30" y="427" class="sub">Two timed iterations per PDF. End-to-end timing includes rendering for image-based engines.</text>
</svg>
