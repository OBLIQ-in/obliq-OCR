<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc">
  <title id="title">Processed PDFs: token F1 and number recall by engine</title>
  <desc id="desc">Grouped horizontal bar chart in percent. Token F1: obliq-ocr 100, EasyOCR 86.19, RapidOCR ONNX 93.06, Tesseract 91.32, docTR 93.55. Number recall: 100, 92.31, 96.30, 94.30, 96.15.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#203047}.title{font-size:23px;font-weight:700}.sub{font-size:13px;fill:#526174}.label{font-size:14px}.value{font-size:11px;font-weight:700}.tick{font-size:12px;fill:#526174}.grid{stroke:#dbe3ec;stroke-width:1}</style>
  <rect width="1000" height="475" rx="14" fill="#fff"/>
  <text x="30" y="40" class="title">Processed PDFs · reference-based text quality</text>
  <text x="30" y="65" class="sub">Percent · higher is better · native PDF text is the reference</text>
  <rect x="650" y="53" width="13" height="13" rx="3" fill="#087f8c"/><text x="670" y="64" class="sub">Token F1</text>
  <rect x="770" y="53" width="13" height="13" rx="3" fill="#e58b2a"/><text x="790" y="64" class="sub">Number recall</text>
  <g class="grid"><line x1="230" y1="95" x2="230" y2="395"/><line x1="360" y1="95" x2="360" y2="395"/><line x1="490" y1="95" x2="490" y2="395"/><line x1="620" y1="95" x2="620" y2="395"/><line x1="750" y1="95" x2="750" y2="395"/><line x1="880" y1="95" x2="880" y2="395"/></g>
  <g class="tick" text-anchor="middle"><text x="230" y="419">0</text><text x="360" y="419">20</text><text x="490" y="419">40</text><text x="620" y="419">60</text><text x="750" y="419">80</text><text x="880" y="419">100%</text></g>
  <g class="label" text-anchor="end"><text x="215" y="137">obliq-ocr</text><text x="215" y="195">EasyOCR</text><text x="215" y="253">RapidOCR ONNX</text><text x="215" y="311">Tesseract</text><text x="215" y="369">docTR</text></g>
  <rect x="230" y="119" width="650" height="16" rx="3" fill="#087f8c"/><text x="886" y="132" class="value">100.00</text>
  <rect x="230" y="137" width="650" height="16" rx="3" fill="#e58b2a"/><text x="886" y="150" class="value">100.00</text>
  <rect x="230" y="177" width="560.2" height="16" rx="3" fill="#087f8c"/><text x="796" y="190" class="value">86.19</text>
  <rect x="230" y="195" width="600.0" height="16" rx="3" fill="#e58b2a"/><text x="836" y="208" class="value">92.31</text>
  <rect x="230" y="235" width="604.9" height="16" rx="3" fill="#087f8c"/><text x="841" y="248" class="value">93.06</text>
  <rect x="230" y="253" width="625.9" height="16" rx="3" fill="#e58b2a"/><text x="862" y="266" class="value">96.30</text>
  <rect x="230" y="293" width="593.6" height="16" rx="3" fill="#087f8c"/><text x="830" y="306" class="value">91.32</text>
  <rect x="230" y="311" width="612.9" height="16" rx="3" fill="#e58b2a"/><text x="849" y="324" class="value">94.30</text>
  <rect x="230" y="351" width="608.1" height="16" rx="3" fill="#087f8c"/><text x="844" y="364" class="value">93.55</text>
  <rect x="230" y="369" width="625.0" height="16" rx="3" fill="#e58b2a"/><text x="862" y="382" class="value">96.15</text>
  <text x="30" y="449" class="sub">Token F1 ignores word order; high F1 can coexist with high CER/WER. obliq-ocr extracts the existing PDF text layer.</text>
</svg>
