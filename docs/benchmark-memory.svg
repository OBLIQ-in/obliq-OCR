<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Overall benchmark: peak measured RSS growth</title>
  <desc id="desc">Horizontal bar chart in MB. obliq-ocr 196, EasyOCR 2991, RapidOCR ONNX 653, Tesseract 0, docTR 465. Memory is measured growth rather than total usage.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#203047}.title{font-size:23px;font-weight:700}.sub{font-size:14px;fill:#526174}.label{font-size:15px}.value{font-size:14px;font-weight:700}.tick{font-size:12px;fill:#526174}.grid{stroke:#dbe3ec;stroke-width:1}</style>
  <rect width="1000" height="430" rx="14" fill="#fff"/>
  <text x="30" y="40" class="title">Overall · peak measured RSS growth</text>
  <text x="30" y="65" class="sub">Megabytes above baseline · lower means less observed growth</text>
  <g class="grid"><line x1="220" y1="95" x2="220" y2="350"/><line x1="360" y1="95" x2="360" y2="350"/><line x1="500" y1="95" x2="500" y2="350"/><line x1="640" y1="95" x2="640" y2="350"/><line x1="780" y1="95" x2="780" y2="350"/><line x1="920" y1="95" x2="920" y2="350"/></g>
  <g class="tick" text-anchor="middle"><text x="220" y="376">0</text><text x="360" y="376">640</text><text x="500" y="376">1,280</text><text x="640" y="376">1,920</text><text x="780" y="376">2,560</text><text x="920" y="376">3,200 MB</text></g>
  <g class="label" text-anchor="end"><text x="205" y="132">obliq-ocr</text><text x="205" y="182">EasyOCR</text><text x="205" y="232">RapidOCR ONNX</text><text x="205" y="282">Tesseract</text><text x="205" y="332">docTR</text></g>
  <rect x="220" y="112" width="42.9" height="25" rx="5" fill="#087f8c"/><text x="272" y="130" class="value">196</text>
  <rect x="220" y="162" width="654.5" height="25" rx="5" fill="#e58b2a"/><text x="883" y="180" class="value">2,991</text>
  <rect x="220" y="212" width="142.8" height="25" rx="5" fill="#3977c3"/><text x="371" y="230" class="value">653</text>
  <rect x="220" y="262" width="2" height="25" fill="#7756a8"/><text x="230" y="280" class="value">0*</text>
  <rect x="220" y="312" width="101.7" height="25" rx="5" fill="#3c9563"/><text x="330" y="330" class="value">465</text>
  <text x="30" y="410" class="sub">*Reported rounded increase above baseline; 0 MB does not mean zero total process memory.</text>
</svg>
